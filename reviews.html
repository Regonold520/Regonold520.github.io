<!doctype html>
<html>
	<head> 
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src="js/globals.js" defer></script>
		<script src="js/reviews.js" defer></script>

		<style type="text/tailwindcss">
            @font-face {
                font-family: "Font";
                src: url(fonts/Marimpa.ttf);
            }

            body {
                font-family: "Font";
				color: #733b11;
            }

			.dotted-line {
				background: repeating-linear-gradient(
					to bottom,
					#93582c 0px,
					#93582c 26px,
					transparent 26px,
					transparent 40px
				);
			}

			@theme {
				--color-peach: #dca980;
				--color-brown: #733b11;
				--color-dark-brown: #462114;
				--color-light-brown: #93582c;
			}

			* {
				scrollbar-width: auto;
				scrollbar-color: #733b11 #dca980;
			}
        </style>

		<title>Behold my epic site</title>
	</head>

	
	<body class="flex min-h-screen bg-peach">
		<div class="relative gap-3 flex flex-col items-center py-5 bg-brown min-h-screen w-10 mx-left outline-8 outline-dark-brown">
			<div class="absolute right-2 top-1 bottom-1 w-1 rounded-full dotted-line"></div>
		</div>
		
		<div class="w-full min-h-screen flex flex-col px-8 gap-7" id="stuff-holder">
			<a href="index.html" class="flex justify-center w-20 mt-5 h-8 rounded-2xl outline outline-5 hover:text-dark-brown hover:outline-dark-brown text-light-brown outline-light-brown transition-[color,border-color]">
				<p class="text-nowrap text-[1.5rem] text-current">Back</p>
			</a>

			<div class="w-full gap-7 px-5 outline outline-light-brown outline-5 rounded-3xl outline-dashed">
				<p class="text-[1.5rem] py-3">This page is for games not made by me that I either really like the game design of or games that have influenced the design choices of my own games. Unless explicitly stated the content on this page was NOT created by me and the correct attributions will be sited accordingly</p>
			</div>

			<div class="flex flex-col gap-5" id="review-holder">
			</div>
			
		</div>

		<div class="relative gap-3 flex flex-col items-center py-5 bg-brown min-h-screen w-10 mx-left outline-8 outline-dark-brown">
			<div class="absolute right-2 top-1 bottom-1 w-1 rounded-full dotted-line"></div>
		</div>
		
	</body>
</html>
