<!doctype html>
<html>
	<head> 
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src="js/globals.js" defer></script>
		<script src="js/projects.js" defer></script>

		<style type="text/tailwindcss">
            @font-face {
                font-family: "Font";
                src: url(fonts/Marimpa.ttf);
            }

            body {
                font-family: "Font";
				color: #733b11;
            }

			.dotted-line {
				background: repeating-linear-gradient(
					to bottom,
					#93582c 0px,
					#93582c 26px,
					transparent 26px,
					transparent 40px
				);
			}

			@theme {
				--color-peach: #dca980;
				--color-brown: #733b11;
				--color-dark-brown: #462114;
				--color-light-brown: #93582c;
			}

			* {
				scrollbar-width: auto;
				scrollbar-color: #733b11 #dca980;
			}
        </style>

		<title>Behold my epic site</title>
	</head>

	<body class="flex min-h-screen bg-peach">
		<div class="relative gap-3 flex flex-col items-center py-5 bg-brown min-h-screen w-10 mx-left outline-8 outline-dark-brown">
			<div class="absolute right-2 top-1 bottom-1 w-1 rounded-full dotted-line"></div>
		</div>

		
		<div class="w-full min-h-screen flex flex-col px-8 gap-7" id="stuff-holder">
			<div class="flex min-w-0 min-h-0 py-10 h-10 py-5 gap-7 items-center" >	
				<a href="index.html" class="flex justify-center w-20 h-8 rounded-2xl outline outline-5 hover:text-dark-brown hover:outline-dark-brown text-light-brown outline-light-brown transition-[color,border-color]">
					<p class="text-nowrap text-[1.5rem] text-current">Back</p>
				</a>
				
				<div class="flex flex-1 justify-between">
					<p class="text-nowrap text-[2rem] text-dark-brown" id="proj-title"></p>
					<p class="text-nowrap text-[2rem] text-dark-brown" id="proj-date"></p>
				</div>
			</div>
			
			<div class="flex flex-row gap-7 items-start">
				<div  class=" flex-1 min-w-0 h-full flex flex-col flex-10">
					<div id="thumbnail-holder" class="mb-6"></div>

					<div id="links-holder" class=" h-20 grid grid-cols-3 gap-3 w-full ">
					</div>

					<div class="flex flex-row justify-center w-full mb-6">
						<p class="text-nowrap  text-[2rem] text-dark-brown">Tech Used</p>
					</div>

					<div id="tech-holder" class=" h-20 grid grid-cols-3 gap-3 w-full">
					</div>
				</div>

				<div  class="w-full flex flex-col flex-12 gap-7 px-5 outline outline-light-brown outline-5 rounded-3xl outline-dashed">
					<p class="text-[1.5rem] py-3" id="project-desc"></p>
				</div>

			</div>
			
			<div class="columns-2 md:columns-3 gap-4" id="gallery-holder">
			</div>
		</div>

		




		<div class="relative gap-3 flex flex-col items-center py-5 bg-brown min-h-screen w-10 mx-left outline-8 outline-dark-brown">
			<div class="absolute right-2 top-1 bottom-1 w-1 rounded-full dotted-line"></div>
		</div>
		
	</body>
</html>
